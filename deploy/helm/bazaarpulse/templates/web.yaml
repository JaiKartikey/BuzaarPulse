apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp.name" . }}-web
  labels: {{- include "bp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "bp.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web }}:{{ include "bp.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: API_UPSTREAM, value: "{{ include "bp.name" . }}-api:8000" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp.name" . }}-web
  labels: {{- include "bp.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 80, targetPort: http }
