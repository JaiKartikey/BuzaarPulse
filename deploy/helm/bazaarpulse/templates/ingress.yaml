{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bp.name" . }}
  labels: {{- include "bp.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API, event streams and WebSockets go straight to the API; everything else is the app.
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ include "bp.name" . }}-api, port: { name: http } } } }
          - { path: /ws, pathType: Prefix, backend: { service: { name: {{ include "bp.name" . }}-api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ include "bp.name" . }}-web, port: { name: http } } } }
{{- end }}
