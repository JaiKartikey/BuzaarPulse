global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  # Workers have no HTTP API; each exposes /metrics on its own port. DNS discovery
  # finds every replica of a scaled service without listing them by hand.
  - job_name: workers
    dns_sd_configs:
      - names: ["ingestor", "processor", "executor", "agents"]
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: worker
