name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    # Real Postgres and Redis, not fakes: the constraint triggers, row locks and
    # consumer groups are exactly what the tests exist to check.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar
          POSTGRES_PASSWORD: bazaar
          POSTGRES_DB: bazaarpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bazaar" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bazaar:bazaar@localhost:5432/bazaarpulse_test
          TEST_REDIS_URL: redis://localhost:6379/15

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npx vite build

  helm:
    name: Helm chart · lint and schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/bazaarpulse --strict
      - name: Render and validate against the Kubernetes API schemas
        run: |
          helm template bp deploy/helm/bazaarpulse > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /w/rendered.yaml

  images:
    name: Images · build, scan, smoke test${{ github.ref == 'refs/heads/main' && ', push' || '' }}
    needs: [backend, frontend, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lower-case the registry path
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: bazaarpulse/backend:local
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: bazaarpulse/web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Scan for known vulnerabilities (fails on fixable critical issues)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bazaarpulse/backend:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The images that will ship, wired together exactly as in production, must come up and trade.
      - name: Smoke test the full stack
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -fs localhost:8080/api/auth/demo -X POST -o /dev/null && break; sleep 2; done
          python3 scripts/smoke_test.py http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in backend web; do
            for tag in "${GITHUB_SHA::12}" latest; do
              docker tag "bazaarpulse/$name:local" "$REGISTRY/bazaarpulse-$name:$tag"
              docker push "$REGISTRY/bazaarpulse-$name:$tag"
            done
          done
