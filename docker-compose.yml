# The whole system on one machine, in the same shape it has in production:
# one stateless API, four independent workers, Postgres, Redis, and monitoring.
#
#   docker compose up --build          # start everything
#   open http://localhost:8080          # the app
#   open http://localhost:3000          # Grafana (admin / admin)
#
# Scale a tier without touching the others, for example:
#   docker compose up -d --scale processor=2 --scale agents=3

x-backend: &backend
  build: ./backend
  image: bazaarpulse/backend:local
  restart: unless-stopped
  environment: &backend-env
    ENV: dev
    DATABASE_URL: postgresql+asyncpg://bazaar:bazaar@postgres:5432/bazaarpulse
    REDIS_URL: redis://redis:6379/0
    EMBEDDED_WORKERS: none
    TICK_PARTITIONS: "2"
    MARKET_PROVIDER: ${MARKET_PROVIDER:-simulator}
    FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
    CORS_ORIGINS: '["http://localhost:8080"]'
  depends_on: &backend-deps
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
      POSTGRES_DB: bazaarpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d bazaarpulse"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file: stream contents and checkpoints survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Schema changes run once, to completion, before anything that depends on the schema starts.
  migrate:
    <<: *backend
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  ingestor:
    <<: *backend
    command: ["worker", "ingestor"]

  processor:
    <<: *backend
    command: ["worker", "processor"]

  executor:
    <<: *backend
    command: ["worker", "executor"]

  agents:
    <<: *backend
    command: ["worker", "agents"]

  web:
    build: ./frontend
    image: bazaarpulse/web:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bazaarpulse.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  promdata:
